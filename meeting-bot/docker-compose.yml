# 10 independent worker bots, one Google account each. Each worker is a
# full copy of this backend (same image, same Flask app on port 5050
# inside its own container) rather than a separate "join-only" service --
# no code changes needed that way: the existing one-job-at-a-time guard in
# app.py's _join() (see CLAUDE.md's "Known accepted limitation") already
# does exactly the right thing per *account* once each account is its own
# process/container, instead of limiting the whole system to one meeting
# ever. All 10 share the same Postgres (meetings/billing/users) and R2
# bucket via the same .env -- only GOOGLE_AUTH_STATE_PATH and the host port
# differ per worker.
#
# Before starting: run bots/google_login.py on the HOST (needs a real
# display + a human for the login step) once per account, saving each
# session to a different auth/worker-N.json:
#   GOOGLE_AUTH_STATE_PATH=auth/worker-1.json python -m bots.google_login
#   GOOGLE_AUTH_STATE_PATH=auth/worker-2.json python -m bots.google_login
#   ...(repeat for however many of the 10 you're actually testing with)
#
# Known gap: the frontend has no concept of "10 backend ports" yet -- it
# still points at one EXPO_PUBLIC_API_URL. Picking which worker handles a
# given join (a queue, round-robin, "first idle") isn't built; for now this
# just proves 10 isolated bot processes can run side by side without
# fighting over one virtual display or one Google session. Wiring the
# frontend/a router to actually pick a free worker is follow-up work.

x-worker-base: &worker-base
  build: .
  env_file: .env
  environment:
    GOOGLE_AUTH_STATE_PATH: /app/auth/google.json
    # The backend stores naive local timestamps (datetime.now()) and the
    # frontend shows them as-is, so the container has to run on the user's
    # timezone. It defaulted to UTC, which made every meeting made since
    # the move to Docker display 8 hours early (07.25 for a 15.25 meeting).
    TZ: Asia/Makassar
    # Hands a finished recording off to transcriber-1/transcriber-2 over
    # this instead of transcribing in-process (see pipeline/job_queue.py,
    # CLAUDE.md's recorder/transcriber split).
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  depends_on: [redis]
  restart: unless-stopped
  # Docker's default /dev/shm is 64MB, too small for Chrome's video
  # compositing/tab-capture buffers -- getDisplayMedia() then fails with
  # "NotReadableError: Could not start video source" (confirmed live on a
  # Zoom join). Chrome's own Docker guidance is 2GB+ for anything doing
  # real video capture, not just page rendering.
  shm_size: "2gb"

services:
  worker-1:
    <<: *worker-base
    ports: ["5050:5050"]
    volumes: ["./auth/worker-1.json:/app/auth/google.json:ro", "./chroma_data:/app/chroma_data", "hf-cache:/root/.cache/huggingface"]
  worker-2:
    <<: *worker-base
    ports: ["5051:5050"]
    volumes: ["./auth/worker-2.json:/app/auth/google.json:ro", "./chroma_data:/app/chroma_data", "hf-cache:/root/.cache/huggingface"]
  worker-3:
    <<: *worker-base
    ports: ["5052:5050"]
    volumes: ["./auth/worker-3.json:/app/auth/google.json:ro", "./chroma_data:/app/chroma_data", "hf-cache:/root/.cache/huggingface"]
  worker-4:
    <<: *worker-base
    ports: ["5053:5050"]
    volumes: ["./auth/worker-4.json:/app/auth/google.json:ro", "./chroma_data:/app/chroma_data", "hf-cache:/root/.cache/huggingface"]
  worker-5:
    <<: *worker-base
    ports: ["5054:5050"]
    volumes: ["./auth/worker-5.json:/app/auth/google.json:ro", "./chroma_data:/app/chroma_data", "hf-cache:/root/.cache/huggingface"]
  worker-6:
    <<: *worker-base
    ports: ["5055:5050"]
    volumes: ["./auth/worker-6.json:/app/auth/google.json:ro", "./chroma_data:/app/chroma_data", "hf-cache:/root/.cache/huggingface"]
  worker-7:
    <<: *worker-base
    ports: ["5056:5050"]
    volumes: ["./auth/worker-7.json:/app/auth/google.json:ro", "./chroma_data:/app/chroma_data", "hf-cache:/root/.cache/huggingface"]
  worker-8:
    <<: *worker-base
    ports: ["5057:5050"]
    volumes: ["./auth/worker-8.json:/app/auth/google.json:ro", "./chroma_data:/app/chroma_data", "hf-cache:/root/.cache/huggingface"]
  worker-9:
    <<: *worker-base
    ports: ["5058:5050"]
    volumes: ["./auth/worker-9.json:/app/auth/google.json:ro", "./chroma_data:/app/chroma_data", "hf-cache:/root/.cache/huggingface"]
  worker-10:
    <<: *worker-base
    ports: ["5059:5050"]
    volumes: ["./auth/worker-10.json:/app/auth/google.json:ro", "./chroma_data:/app/chroma_data", "hf-cache:/root/.cache/huggingface"]

  # Optimization plan, Day 3 ("image ramping") — a throwaway benchmarking
  # service, NOT part of the worker-1..10 fleet above (worker-1 stays
  # untouched per the plan's safety rule). Builds with TORCH_CPU=1 (see
  # Dockerfile) to drop the unused CUDA torch build; mem_limit/cpus/
  # OMP_NUM_THREADS constrain it to one candidate "how ramped can one bot
  # get" footprint instead of Docker Desktop's default (whatever's free).
  # No Google auth mount -- test with Zoom (no login needed) rather than
  # spending a spare Google account on a throwaway container. Shares the
  # same Postgres/R2 as everything else (same .env), so a test join still
  # writes a real row under whichever account starts it, same as worker-1.
  worker-test:
    build:
      context: .
      args:
        TORCH_CPU: "1"
    env_file: .env
    environment:
      GOOGLE_AUTH_STATE_PATH: /app/auth/google.json
      TZ: Asia/Makassar
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Caps BLAS/OpenMP thread fan-out inside faster-whisper/pyannote --
      # without this each transcription job can spawn one thread per host
      # core regardless of the container's own cpus limit below, which is
      # exactly the oversubscription Day 5's "lock so two jobs don't share
      # the model" concern is about. Kept even though worker-test no longer
      # runs transcription itself (see the recorder/transcriber split
      # above) -- harmless if unused, and one less thing to remember to
      # re-add if this ever transcribes in-process again.
      OMP_NUM_THREADS: "2"
    depends_on: [redis]
    mem_limit: "3g"
    cpus: "2.0"
    shm_size: "2gb"
    ports: ["5060:5050"]
    volumes: ["./chroma_data:/app/chroma_data", "hf-cache:/root/.cache/huggingface"]

  # Day 5 ("2 bot Zoom bersamaan") -- a second, independent Flask process so
  # there are two separate _jobs/_join() 409-guards to join two Zoom
  # meetings at once (the guard is per-process, so one worker-test alone
  # can never hold 2 concurrent recordings no matter how much RAM/CPU it's
  # given). Reuses worker-test's already-built image directly (no `build:`
  # here) -- rebuild worker-test, both services pick it up on next `up`.
  worker-test-2:
    image: meeting-bot-worker-test:latest
    env_file: .env
    environment:
      GOOGLE_AUTH_STATE_PATH: /app/auth/google.json
      TZ: Asia/Makassar
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      OMP_NUM_THREADS: "2"
    depends_on: [redis]
    mem_limit: "3g"
    cpus: "2.0"
    shm_size: "2gb"
    ports: ["5061:5050"]
    volumes: ["./chroma_data:/app/chroma_data", "hf-cache:/root/.cache/huggingface"]

  # Redis queue linking recorders (worker-*) to transcribers (transcriber-*)
  # -- see pipeline/job_queue.py. requirepass even though it's never
  # exposed to the host (no `ports:` here, only reachable by other
  # containers on this compose network) -- defense in depth against a
  # future port-mapping mistake, especially once this runs on a real VPS.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    restart: unless-stopped
    volumes: ["redis-data:/data"]

  # i04's transcriber side of the split, see CLAUDE.md. Built from the same
  # Dockerfile.transcriber as the meeting-bot-transcriber POC image, but run
  # as a long-lived worker (transcriber_service.py) instead of a one-shot
  # smoke test. Two instances (not more, not fewer) per the plan's own
  # decision: bounds transcription's RAM/CPU (the heaviest part of the
  # whole pipeline) to at most 2 jobs at once regardless of how many
  # recorders are running, rather than scaling 1:1 with bot count.
  transcriber-1:
    build:
      context: .
      dockerfile: Dockerfile.transcriber
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Names this worker's Redis processing list, so it can recover its own
      # unfinished job after a crash (pipeline/job_queue.py). Must not change.
      TRANSCRIBER_ID: transcriber-1
      OMP_NUM_THREADS: "2"
    depends_on: [redis]
    restart: unless-stopped
    # 6g: a 60-minute meeting measured ~4.0GB peak (a 2.5-minute clip only ~2.7GB), so
    # memory grows with meeting length. Recorders stay at 3g.
    mem_limit: "6g"  # a 60-minute meeting peaked at ~4.0 GB, so 4g would have OOM-killed it
    cpus: "2.0"
    volumes: ["hf-cache:/root/.cache/huggingface"]
  transcriber-2:
    build:
      context: .
      dockerfile: Dockerfile.transcriber
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Names this worker's Redis processing list, so it can recover its own
      # unfinished job after a crash (pipeline/job_queue.py). Must not change.
      TRANSCRIBER_ID: transcriber-2
      OMP_NUM_THREADS: "2"
    depends_on: [redis]
    restart: unless-stopped
    mem_limit: "6g"  # a 60-minute meeting peaked at ~4.0 GB, so 4g would have OOM-killed it
    cpus: "2.0"
    volumes: ["hf-cache:/root/.cache/huggingface"]

# Model downloads (whisper, alignment, pyannote) live here so they survive
# recreating a container. A named volume, not a host bind mount: it sits on
# the WSL2 ext4 disk, which is much faster to read big model files from than
# a Windows bind mount. All workers share it.
volumes:
  hf-cache:
  redis-data:
