# Nama project sama seperti sebelum folder jadi backend/, supaya volume yang ada (cache model) dan image tetap dipakai.
name: meeting-bot

# Perekam: sampai 10 bot. Tiap worker adalah seluruh backend (image sama, Flask di 5050 di dalam container) dengan
# display Xvfb dan login Google sendiri, dan satu pengambil tugas yang merekam SATU rapat sekali jalan (dua bot di satu
# display akan merekam jendela satu sama lain). API di worker mana pun menaruh tugas join ke antrean Redis
# (pipeline/join_queue.py) dan worker yang kosong mengambilnya, jadi frontend cukup menunjuk satu EXPO_PUBLIC_API_URL.
# Mereka berbagi Postgres, R2, dan Redis lewat .env, hanya file sesi Google dan port host yang berbeda.
#
# Login tiap akun sekali di HOST (butuh layar dan orangnya), satu file sesi per worker:
#   GOOGLE_AUTH_STATE_PATH=auth/worker-1.json python -m bots.google_login
#   GOOGLE_AUTH_STATE_PATH=auth/worker-2.json python -m bots.google_login
# lalu isi WORKER_PLATFORMS worker itu dengan google_meet,zoom (bawaan: zoom saja).
#
# Kekurangan: baru worker-1 yang login. Rapat yang menunggu worker kosong lebih dari JOIN_QUEUE_MAX_WAIT_SECONDS (600)
# dibatalkan. Server yang hanya melayani API (tanpa bot) cukup diberi RECORDER=0.

x-worker-env: &worker-env
  GOOGLE_AUTH_STATE_PATH: /app/auth/google.json
  # timestamp adalah waktu lokal tanpa zona dan frontend menampilkannya apa adanya, jadi container butuh zona waktu
  # user (di UTC tiap rapat tampil 8 jam lebih awal)
  TZ: Asia/Makassar
  # antrean join dan rekaman yang selesai diserahkan ke transkriber lewat ini
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  # platform yang diambil worker ini dari antrean join. Zoom tidak butuh akun, Meet butuh sesi Google yang sudah login
  # (auth/worker-N.json): tambahkan google_meet hanya untuk worker yang sudah login, seperti worker-1 di bawah
  WORKER_PLATFORMS: zoom

x-worker-base: &worker-base
  build: .
  env_file: .env
  environment: *worker-env
  depends_on: [redis]
  restart: unless-stopped
  # /dev/shm bawaan Docker (64MB) terlalu kecil untuk buffer capture Chrome, getDisplayMedia() gagal dengan
  # "NotReadableError: Could not start video source". Saran Chrome sendiri untuk capture video adalah 2GB+
  shm_size: "2gb"

# transkriber: transkripsinya di Replicate, container ini hanya menunggu hasilnya, memanggil OpenAI, dan menyimpan ke R2/Postgres
x-transcriber-base: &transcriber-base
  build:
    context: .
    dockerfile: Dockerfile.transcriber
  env_file: .env
  depends_on: [redis]
  restart: unless-stopped
  mem_limit: "1g"
  cpus: "1.0"

services:
  worker-1:
    <<: *worker-base
    environment:
      <<: *worker-env
      WORKER_PLATFORMS: google_meet,zoom
    ports: ["5050:5050"]
    volumes: ["./auth/worker-1.json:/app/auth/google.json:ro", "./chroma_data:/app/chroma_data", "hf-cache:/root/.cache/huggingface"]
  worker-2:
    <<: *worker-base
    ports: ["5051:5050"]
    volumes: ["./auth/worker-2.json:/app/auth/google.json:ro", "./chroma_data:/app/chroma_data", "hf-cache:/root/.cache/huggingface"]
  worker-3:
    <<: *worker-base
    ports: ["5052:5050"]
    volumes: ["./auth/worker-3.json:/app/auth/google.json:ro", "./chroma_data:/app/chroma_data", "hf-cache:/root/.cache/huggingface"]
  worker-4:
    <<: *worker-base
    ports: ["5053:5050"]
    volumes: ["./auth/worker-4.json:/app/auth/google.json:ro", "./chroma_data:/app/chroma_data", "hf-cache:/root/.cache/huggingface"]
  worker-5:
    <<: *worker-base
    ports: ["5054:5050"]
    volumes: ["./auth/worker-5.json:/app/auth/google.json:ro", "./chroma_data:/app/chroma_data", "hf-cache:/root/.cache/huggingface"]
  worker-6:
    <<: *worker-base
    ports: ["5055:5050"]
    volumes: ["./auth/worker-6.json:/app/auth/google.json:ro", "./chroma_data:/app/chroma_data", "hf-cache:/root/.cache/huggingface"]
  worker-7:
    <<: *worker-base
    ports: ["5056:5050"]
    volumes: ["./auth/worker-7.json:/app/auth/google.json:ro", "./chroma_data:/app/chroma_data", "hf-cache:/root/.cache/huggingface"]
  worker-8:
    <<: *worker-base
    ports: ["5057:5050"]
    volumes: ["./auth/worker-8.json:/app/auth/google.json:ro", "./chroma_data:/app/chroma_data", "hf-cache:/root/.cache/huggingface"]
  worker-9:
    <<: *worker-base
    ports: ["5058:5050"]
    volumes: ["./auth/worker-9.json:/app/auth/google.json:ro", "./chroma_data:/app/chroma_data", "hf-cache:/root/.cache/huggingface"]
  worker-10:
    <<: *worker-base
    ports: ["5059:5050"]
    volumes: ["./auth/worker-10.json:/app/auth/google.json:ro", "./chroma_data:/app/chroma_data", "hf-cache:/root/.cache/huggingface"]

  # antrean antara perekam dan transkriber (pipeline/job_queue.py). Diberi password walau tidak ada
  # `ports:` (hanya jaringan compose ini yang menjangkaunya), kalau-kalau ada port mapping yang tertambah karena salah di VPS sungguhan
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    restart: unless-stopped
    volumes: ["redis-data:/data"]

  # Dua transkriber memproses 2 job sekaligus, berapa pun bot yang merekam. Beratnya di Replicate dan OpenAI, bukan di
  # sini, jadi ringan (tidak ada lagi model di container). Batas permintaan Replicate (6 per menit di bawah saldo US$5)
  # ditangani retry di replicate_transcribe.py.
  # TRANSCRIBER_ID menamai list Redis berisi job worker yang belum selesai (job_queue.py), tidak boleh berubah.
  transcriber-1:
    <<: *transcriber-base
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TRANSCRIBER_ID: transcriber-1
  transcriber-2:
    <<: *transcriber-base
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TRANSCRIBER_ID: transcriber-2

# model embedding Knowledge Base (sentence-transformers) disimpan di sini supaya selamat saat container dibuat ulang. Volume
# bernama, bukan bind mount: ada di disk WSL2, jauh lebih cepat untuk file model besar daripada bind mount Windows.
# Dipakai bersama semua worker
volumes:
  hf-cache:
  redis-data:
